name: PR VSA Signing Probe

on:
  pull_request:
    paths:
      - .github/workflows/slsa.yaml
      - .github/workflows/pr-vsa-sign-test.yaml

permissions: {}

jobs:
  vsa_sign_probe:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            github-releases.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            artifactcache.actions.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ctfe.sigstore.dev:443
            oauth2.sigstore.dev:443
            timestamp.sigstore.dev:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Install cosign (pinned)
        env:
          COSIGN_VERSION: v3.0.4
          COSIGN_SHA256: 10dab2fd2170b5aa0d5c0673a9a2793304960220b314f6a873bf39c2f08287aa
        run: |
          set -euo pipefail
          curl -sSfL --proto '=https' --proto-redir '=https' --max-redirs 1 \
            -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign

      - name: Sign dummy VSA (probe)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          echo '{}' > verification-summary.attestation.json
          cosign sign-blob --yes \
            --bundle verification-summary.attestation.json.bundle \
            verification-summary.attestation.json
