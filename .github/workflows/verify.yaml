name: Verify Release

on:
  workflow_call:
    inputs:
      repo:
        description: 'Repository in owner/name form to verify'
        type: string
        required: true
      tag:
        description: 'Release tag to verify'
        type: string
        required: true
      mode:
        description: 'Comma-separated verify-release modes (quick,full,reproduce,vsa)'
        type: string
        required: false
        default: full
      emit_vsa:
        description: 'Emit a Verification Summary Attestation during full mode'
        type: boolean
        required: false
        default: false
      verifier_id:
        description: 'Verifier identifier to embed when emitting a VSA'
        type: string
        required: false
        default: 'https://github.com/bytemare/slsa/.github/workflows/verify.yaml'
      verifier_metadata:
        description: 'Multi-line key=value pairs for verifier metadata (passed as --verifier-version args)'
        type: string
        required: false
      resource_uri:
        description: 'Resource URI describing the artifact under verification'
        type: string
        required: false
      policy_uri:
        description: 'Policy URI to embed when emitting a VSA'
        type: string
        required: false
      upload_to_release:
        description: 'Upload VSA files to GitHub release (requires contents: write permission)'
        type: boolean
        required: false
        default: false
      verify_vsa_after_upload:
        description: 'Verify uploaded VSA with retry logic after upload'
        type: boolean
        required: false
        default: false
      cosign_version:
        description: 'Cosign version override (default: from tool-versions.json)'
        type: string
        required: false
      cosign_sha256:
        description: 'SHA-256 override for cosign (default: from tool-versions.json)'
        type: string
        required: false
      slsa_verifier_version:
        description: 'slsa-verifier version override (default: from tool-versions.json)'
        type: string
        required: false
      workflow_repo:
        description: >-
          Reusable workflow repository (owner/repo) to fetch helper scripts. This is only useful for
          forks of the workflow so that they can point to their own repo.
        type: string
        required: false
        default: bytemare/slsa
      workflow_ref:
        description: >-
          Reusable workflow ref to check out (tag/sha/branch). Set this to the
          same ref used in the caller's uses: statement to keep scripts pinned.
        type: string
        required: true
      builder_image:
        description: 'Builder image override (default: from tool-versions.json)'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:

  # ===============================================================
  # Load tool versions from central config
  # ===============================================================
  load_versions:
    name: Load tool versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cosign_version: ${{ steps.resolve.outputs.cosign_version }}
      cosign_sha256: ${{ steps.resolve.outputs.cosign_sha256 }}
      slsa_verifier_version: ${{ steps.resolve.outputs.slsa_verifier_version }}
      builder_image: ${{ steps.resolve.outputs.builder_image }}
      artifact_tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate required inputs
        id: validate
        shell: bash
        env:
          INPUT_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          INPUT_WORKFLOW_REPO: ${{ inputs.workflow_repo }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
        run: |
          if [[ -z "$INPUT_WORKFLOW_REF" ]]; then
            echo "::error title=Missing Required Input::workflow_ref is required. Set it to the same ref used in uses: ...@<ref>"
            exit 1
          fi
          if [[ -z "$INPUT_REPO" ]]; then
            echo "::error title=Missing Required Input::repo is required (owner/name format)"
            exit 1
          fi
          if [[ -z "$INPUT_TAG" ]]; then
            echo "::error title=Missing Required Input::tag is required"
            exit 1
          fi
          
          # Export validated values for use in checkout
          workflow_repo="${INPUT_WORKFLOW_REPO:-bytemare/slsa}"
          echo "workflow_repo=${workflow_repo}" >> "$GITHUB_OUTPUT_FILE"
          echo "workflow_ref=${INPUT_WORKFLOW_REF}" >> "$GITHUB_OUTPUT_FILE"
          echo "repo=${INPUT_REPO}" >> "$GITHUB_OUTPUT_FILE"
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT_FILE"

      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.validate.outputs.workflow_repo }}
          ref: ${{ steps.validate.outputs.workflow_ref }}
          sparse-checkout: .github/tool-versions.json
          fetch-depth: 1

      - name: Load and resolve versions
        id: resolve
        env:
          GITHUB_OUTPUT_FILE: ${{ github.output }}
          INPUT_COSIGN_VERSION: ${{ inputs.cosign_version }}
          INPUT_COSIGN_SHA256: ${{ inputs.cosign_sha256 }}
          INPUT_SLSA_VERIFIER_VERSION: ${{ inputs.slsa_verifier_version }}
          INPUT_BUILDER_IMAGE: ${{ inputs.builder_image }}
        run: |
          set -euo pipefail
          CONFIG=".github/tool-versions.json"

          cosign_version="${INPUT_COSIGN_VERSION:-$(jq -r '.tools.cosign.version' "$CONFIG")}"
          cosign_sha256="${INPUT_COSIGN_SHA256:-$(jq -r '.tools.cosign.sha256' "$CONFIG")}"
          slsa_verifier_version="${INPUT_SLSA_VERIFIER_VERSION:-$(jq -r '.tools["slsa-verifier"].version' "$CONFIG")}"

          if [[ -n "${INPUT_BUILDER_IMAGE:-}" ]]; then
            builder_image="${INPUT_BUILDER_IMAGE}"
          else
            img=$(jq -r '.tools["builder-image"].image' "$CONFIG")
            tag=$(jq -r '.tools["builder-image"].tag' "$CONFIG")
            digest=$(jq -r '.tools["builder-image"].digest' "$CONFIG")
            builder_image="${img}:${tag}@${digest}"
          fi

          {
            echo "cosign_version=${cosign_version}"
            echo "cosign_sha256=${cosign_sha256}"
            echo "slsa_verifier_version=${slsa_verifier_version}"
            echo "builder_image=${builder_image}"
          } >> "$GITHUB_OUTPUT_FILE"

          echo "Resolved tool versions:"
          echo "  cosign: ${cosign_version} (sha256: ${cosign_sha256:0:16}...)"
          echo "  slsa-verifier: ${slsa_verifier_version}"
          echo "  builder-image: ${builder_image}"

  # ===============================================================
  # Run verification modes
  # ===============================================================
  verify:
    needs: load_versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            github-releases.githubusercontent.com:443
            github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            rekor.sigstore.dev:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            timestamp.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT_FILE"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT_FILE"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - name: Compute verifier metadata
        id: verifier_metadata
        env:
          USER_METADATA: ${{ inputs.verifier_metadata }}
          WORKFLOW_REF: ${{ steps.workflow_source.outputs.ref }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
        run: |
          set -euo pipefail
          
          # Compute script integrity hash
          script_sha=$(sha256sum slsa-workflow/verify-release.sh | awk '{print $1}')
          
          # Build default metadata
          metadata="workflow_ref=${WORKFLOW_REF}"
          metadata+=$'\n'
          metadata+="script_sha=${script_sha}"
          
          # Merge with user-provided metadata
          if [[ -n "${USER_METADATA:-}" ]]; then
            metadata+=$'\n'
            metadata+="${USER_METADATA}"
          fi
          
          # Export for use in later steps
          {
            echo "metadata<<EOF"
            echo "${metadata}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT_FILE"
          
          echo "Verifier metadata:"
          echo "${metadata}"

      - name: Prepare tooling
        id: setup
        shell: bash
        env:
          GHA_MODES_INPUT: ${{ inputs.mode }}
          GHA_COSIGN_VERSION: ${{ needs.load_versions.outputs.cosign_version }}
          GHA_COSIGN_SHA256: ${{ needs.load_versions.outputs.cosign_sha256 }}
          GHA_SLSA_VERIFIER_VERSION: ${{ needs.load_versions.outputs.slsa_verifier_version }}
          GHA_BUILDER_IMAGE: ${{ needs.load_versions.outputs.builder_image }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
          GITHUB_PATH_FILE: ${{ github.path }}
        run: |
          set -euo pipefail

          modes_input="${GHA_MODES_INPUT}"
          if [[ -z "$modes_input" ]]; then
            modes_input="full"
          fi

          IFS=',' read -ra raw_modes <<< "$modes_input"
          declare -a modes=()
          need_verifier=false
          need_docker=false

          for raw_mode in "${raw_modes[@]}"; do
            mode=$(echo "$raw_mode" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            if [[ -z "$mode" ]]; then
              continue
            fi
            case "$mode" in
              quick|full|vsa)
                need_verifier=true
                ;;
              reproduce)
                need_docker=true
                ;;
              *)
                echo "Unsupported mode '$raw_mode'" >&2
                exit 1
                ;;
            esac
            modes+=("$mode")
          done

          if [[ ${#modes[@]} -eq 0 ]]; then
            modes+=(full)
            need_verifier=true
          fi

          {
            echo "modes=$(IFS=,; echo "${modes[*]}")"
            echo "need_verifier=$need_verifier"
            echo "need_docker=$need_docker"
          } >> "$GITHUB_OUTPUT_FILE"

          if [[ "$need_verifier" == "true" ]]; then
            curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
              --proto '=https' --proto-redir '=https' --max-redirs 1 \
              -o cosign "https://github.com/sigstore/cosign/releases/download/${GHA_COSIGN_VERSION}/cosign-linux-amd64"
            echo "${GHA_COSIGN_SHA256}  cosign" | sha256sum -c -
            install -m 0755 cosign /usr/local/bin/cosign

            go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@"${GHA_SLSA_VERIFIER_VERSION}"
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH_FILE"
          fi
  
          if [[ "$need_docker" == "true" ]]; then
            docker info >/dev/null
            docker pull "${GHA_BUILDER_IMAGE}" >/dev/null
          fi

      - name: Run verification modes
        env:
          COSIGN_EXPERIMENTAL: 1
          GH_TOKEN: ${{ github.token }}
          GHA_CALLER_REPO: ${{ github.repository }}
          GHA_MODES: ${{ steps.setup.outputs.modes }}
          GHA_EMIT_VSA: ${{ inputs.emit_vsa }}
          GHA_VERIFIER_ID: ${{ inputs.verifier_id }}
          GHA_VERIFIER_METADATA: ${{ steps.verifier_metadata.outputs.metadata }}
          GHA_RESOURCE_URI: ${{ inputs.resource_uri }}
          GHA_POLICY_URI: ${{ inputs.policy_uri }}
          GHA_INPUT_REPO: ${{ inputs.repo }}
          GHA_INPUT_TAG: ${{ inputs.tag }}
          GHA_WORKFLOW_REPO: ${{ inputs.workflow_repo }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GHA_INPUT_REPO}" != "${GHA_CALLER_REPO}" ]]; then
            echo "::error title=Cross-Repo Not Supported::Cross-repo verification is not supported in this workflow. Run it from the target repo or use verify-release.sh directly."
            exit 1
          fi

          IFS=',' read -ra modes <<< "${GHA_MODES}"
          emit_vsa="${GHA_EMIT_VSA}"
          verifier_id="${GHA_VERIFIER_ID}"
          verifier_metadata="${GHA_VERIFIER_METADATA}"
          resource_uri="${GHA_RESOURCE_URI}"
          policy_uri="${GHA_POLICY_URI}"

          declare -a emit_args=()
          if [[ "$emit_vsa" == "true" ]]; then
            emit_args+=(--emit-vsa verification-summary.attestation.json)
            emit_args+=(--policy-file slsa-workflow/verify-release.sh)
            emit_args+=(--verifier-id "$verifier_id")
            if [[ -n "$policy_uri" ]]; then
              emit_args+=(--policy-uri "$policy_uri")
            fi
            if [[ -n "$verifier_metadata" ]]; then
              while IFS= read -r line; do
                if [[ -n "$line" ]]; then
                  emit_args+=(--verifier-version "$line")
                fi
              done <<< "$verifier_metadata"
            fi
            if [[ -n "$resource_uri" ]]; then
              emit_args+=(--resource-uri "$resource_uri")
            fi
          fi

          saw_full=false
          for mode in "${modes[@]}"; do
            if [[ -z "$mode" ]]; then
              continue
            fi
            case "$mode" in
              quick|full|reproduce|vsa) : ;;
              *) echo "Unsupported mode '$mode'" >&2; exit 1 ;;
            esac

            declare -a extra_args=()
            if [[ "$mode" == "full" ]]; then
              saw_full=true
              if [[ "$emit_vsa" == "true" ]]; then
                extra_args+=("${emit_args[@]}")
              fi
            fi

            echo "Running verify-release.sh in $mode mode"
            ./slsa-workflow/verify-release.sh \
              --repo "${GHA_INPUT_REPO}" \
              --tag "${GHA_INPUT_TAG}" \
              --mode "$mode" \
              --signer-repo "${GHA_WORKFLOW_REPO}" \
              "${extra_args[@]}"
          done

          if [[ "$emit_vsa" == "true" && "$saw_full" != "true" ]]; then
            echo "emit_vsa requested but no full mode was executed" >&2
            exit 1
          fi

      - name: Sign emitted VSA
        if: ${{ inputs.emit_vsa }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "emit_vsa requires id-token: write permissions" >&2
            exit 1
          fi
          rm -f verification-summary.attestation.json.bundle
          cosign sign-blob --yes --bundle verification-summary.attestation.json.bundle verification-summary.attestation.json

      - name: Upload VSA to release
        if: ${{ inputs.emit_vsa && inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          
          # Install gh CLI if not present
          if ! command -v gh &> /dev/null; then
            echo "Installing gh CLI..."
            curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
              --proto '=https' --proto-redir '=https' --max-redirs 1 \
              -o gh.tar.gz "https://github.com/cli/cli/releases/download/v2.40.1/gh_2.40.1_linux_amd64.tar.gz"
            tar -xzf gh.tar.gz
            install -m 0755 gh_2.40.1_linux_amd64/bin/gh /usr/local/bin/gh
          fi
          
          echo "Uploading VSA files to release ${RELEASE_TAG}..."
          gh release upload "$RELEASE_TAG" \
            verification-summary.attestation.json \
            verification-summary.attestation.json.bundle \
            --repo "$TARGET_REPO" \
            --clobber

      - name: Verify uploaded VSA
        if: ${{ inputs.verify_vsa_after_upload }}
        env:
          COSIGN_EXPERIMENTAL: 1
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.repo }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REPO: ${{ inputs.workflow_repo }}
        run: |
          set -euo pipefail
          echo "Verifying uploaded VSA with retry logic..."
          for attempt in 1 2 3 4 5; do
            if ./slsa-workflow/verify-release.sh \
                --repo "$TARGET_REPO" \
                --tag "$RELEASE_TAG" \
                --mode vsa \
                --signer-repo "$WORKFLOW_REPO"; then
              echo "VSA verification succeeded"
              exit 0
            fi
            echo "VSA not available yet (attempt ${attempt}/5); retrying in 6s..." >&2
            sleep 6
          done
          echo "::error title=VSA Verification Failed::VSA verification failed after 5 attempts" >&2
          exit 1

      - name: Upload VSA artifact
        if: ${{ inputs.emit_vsa && !inputs.upload_to_release }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vsa-${{ needs.load_versions.outputs.artifact_tag }}
          if-no-files-found: error
          path: |
            verification-summary.attestation.json
            verification-summary.attestation.json.bundle
