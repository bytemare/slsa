name: Verify Release

on:
  workflow_call:
    inputs:
      repo:
        description: 'Repository in owner/name form to verify'
        type: string
        required: true
      tag:
        description: 'Release tag to verify'
        type: string
        required: true
      mode:
        description: 'Comma-separated verify-release modes (quick,full,reproduce,vsa)'
        type: string
        required: false
        default: full
      emit_vsa:
        description: 'Emit a Verification Summary Attestation during full mode'
        type: boolean
        required: false
        default: false
      verifier_id:
        description: 'Verifier identifier to embed when emitting a VSA'
        type: string
        required: false
        default: 'https://github.com/bytemare/slsa/.github/workflows/verify.yaml'
      policy_uri:
        description: 'Policy URI to embed when emitting a VSA'
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@92c522aaa6f53af082553dedc1596c80b71aba33
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            github-releases.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            auth.docker.io:443
            registry-1.docker.io:443

      - name: Checkout verifier repo
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493
        with:
          fetch-depth: 0

      - name: Prepare tooling
        id: setup
        shell: bash
        env:
          MODES_INPUT: ${{ inputs.mode }}
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail

          modes_input="${MODES_INPUT}"
          if [[ -z "$modes_input" ]]; then
            modes_input="full"
          fi

          IFS=',' read -ra raw_modes <<< "$modes_input"
          declare -a modes=()
          need_verifier=false
          need_docker=false

          for raw_mode in "${raw_modes[@]}"; do
            mode=$(echo "$raw_mode" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            if [[ -z "$mode" ]]; then
              continue
            fi
            case "$mode" in
              quick|full|vsa)
                need_verifier=true
                ;;
              reproduce)
                need_docker=true
                ;;
              *)
                echo "Unsupported mode '$raw_mode'" >&2
                exit 1
                ;;
            esac
            modes+=("$mode")
          done

          if [[ ${#modes[@]} -eq 0 ]]; then
            modes+=(full)
            need_verifier=true
          fi

          {
            echo "modes=$(IFS=,; echo "${modes[*]}")"
            echo "need_verifier=$need_verifier"
            echo "need_docker=$need_docker"
          } >> "$GITHUB_OUTPUT"

          if [[ "$need_verifier" == "true" ]]; then
            COSIGN_VERSION=v2.4.0
            COSIGN_SHA256=cd7636b3586a3bdac2d9c8f3b421ed119edcb20499107887fd929211110e8418
            curl -sSLo cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
            echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
            install -m 0755 cosign /usr/local/bin/cosign

            go install github.com/slsa-framework/slsa-verifier/v2/cmd/slsa-verifier@v2.7.0
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

          if [[ "$need_docker" == "true" ]]; then
            docker info >/dev/null
            docker pull golang:1.25-bookworm@sha256:42d8e9dea06f23d0bfc908826455213ee7f3ed48c43e287a422064220c501be9 >/dev/null
          fi

      - name: Run verification modes
        env:
          COSIGN_EXPERIMENTAL: 1
          MODES: ${{ steps.setup.outputs.modes }}
          EMIT_VSA: ${{ inputs.emit_vsa }}
          VERIFIER_ID: ${{ inputs.verifier_id }}
          POLICY_URI: ${{ inputs.policy_uri }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail

          IFS=',' read -ra modes <<< "${MODES}"
          emit_vsa="${EMIT_VSA}"
          verifier_id="${VERIFIER_ID}"
          policy_uri="${POLICY_URI}"

          declare -a emit_args=()
          if [[ "$emit_vsa" == "true" ]]; then
            emit_args+=(--emit-vsa verification-summary.attestation.json)
            emit_args+=(--policy-file verify-release.sh)
            emit_args+=(--verifier-id "$verifier_id")
            if [[ -n "$policy_uri" ]]; then
              emit_args+=(--policy-uri "$policy_uri")
            fi
          fi

          saw_full=false
          for mode in "${modes[@]}"; do
            if [[ -z "$mode" ]]; then
              continue
            fi
            case "$mode" in
              quick|full|reproduce|vsa) : ;;
              *) echo "Unsupported mode '$mode'" >&2; exit 1 ;;
            esac

            declare -a extra_args=()
            if [[ "$mode" == "full" ]]; then
              saw_full=true
              if [[ "$emit_vsa" == "true" ]]; then
                extra_args+=("${emit_args[@]}")
              fi
            elif [[ "$mode" == "reproduce" && "$emit_vsa" == "true" ]]; then
              echo "emit_vsa is only supported with full mode" >&2
              exit 1
            fi

            echo "Running verify-release.sh in $mode mode"
            ./verify-release.sh \
              --repo "${INPUT_REPO}" \
              --tag "${INPUT_TAG}" \
              --mode "$mode" \
              "${extra_args[@]}"
          done

          if [[ "$emit_vsa" == "true" && "$saw_full" != "true" ]]; then
            echo "emit_vsa requested but no full mode was executed" >&2
            exit 1
          fi

      - name: Upload VSA artifact
        if: ${{ inputs.emit_vsa }}
        uses: actions/upload-artifact@2848b2cda0e5190984587ec6bb1f36730ca78d50
        with:
          name: vsa-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            verification-summary.attestation.json
            verification-summary.attestation.json.bundle
