name: Verify Release

on:
  workflow_call:
    inputs:
      repo:
        description: 'Repository in owner/name form to verify'
        type: string
        required: true
      tag:
        description: 'Release tag to verify'
        type: string
        required: true
      mode:
        description: 'Comma-separated verify-release modes (quick,full,reproduce,vsa)'
        type: string
        required: false
        default: full
      emit_vsa:
        description: 'Emit a Verification Summary Attestation during full mode'
        type: boolean
        required: false
        default: false
      verifier_id:
        description: 'Verifier identifier to embed when emitting a VSA'
        type: string
        required: false
        default: 'https://github.com/bytemare/slsa/.github/workflows/verify.yaml'
      policy_uri:
        description: 'Policy URI to embed when emitting a VSA'
        type: string
        required: false
      cosign_version:
        description: 'Cosign version override (default: from tool-versions.json)'
        type: string
        required: false
      cosign_sha256:
        description: 'SHA-256 override for cosign (default: from tool-versions.json)'
        type: string
        required: false
      slsa_verifier_version:
        description: 'slsa-verifier version override (default: from tool-versions.json)'
        type: string
        required: false
      workflow_repo:
        description: >-
          Reusable workflow repository (owner/repo) to fetch helper scripts. This is only useful for
          forks of the workflow so that they can point to their own repo.
        type: string
        required: false
        default: bytemare/slsa
      workflow_ref:
        description: >-
          Reusable workflow ref to check out (tag/sha/branch). Set this to the
          same ref used in the caller's uses: statement to keep scripts pinned.
        type: string
        required: true
      builder_image:
        description: 'Builder image override (default: from tool-versions.json)'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:

  # ===============================================================
  # Load tool versions from central config
  # ===============================================================
  load_versions:
    name: Load tool versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cosign_version: ${{ steps.resolve.outputs.cosign_version }}
      cosign_sha256: ${{ steps.resolve.outputs.cosign_sha256 }}
      slsa_verifier_version: ${{ steps.resolve.outputs.slsa_verifier_version }}
      builder_image: ${{ steps.resolve.outputs.builder_image }}
    steps:
      - name: Validate required inputs
        shell: bash
        run: |
          if [[ -z "${{ inputs.workflow_ref }}" ]]; then
            echo "::error title=Missing Required Input::workflow_ref is required. Set it to the same ref used in uses: ...@<ref>"
            exit 1
          fi
          if [[ -z "${{ inputs.repo }}" ]]; then
            echo "::error title=Missing Required Input::repo is required (owner/name format)"
            exit 1
          fi
          if [[ -z "${{ inputs.tag }}" ]]; then
            echo "::error title=Missing Required Input::tag is required"
            exit 1
          fi

      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ inputs.workflow_repo || 'bytemare/slsa' }}
          ref: ${{ inputs.workflow_ref }}
          sparse-checkout: .github/tool-versions.json
          fetch-depth: 1

      - name: Load and resolve versions
        id: resolve
        env:
          INPUT_COSIGN_VERSION: ${{ inputs.cosign_version }}
          INPUT_COSIGN_SHA256: ${{ inputs.cosign_sha256 }}
          INPUT_SLSA_VERIFIER_VERSION: ${{ inputs.slsa_verifier_version }}
          INPUT_BUILDER_IMAGE: ${{ inputs.builder_image }}
        run: |
          set -euo pipefail
          CONFIG=".github/tool-versions.json"

          cosign_version="${INPUT_COSIGN_VERSION:-$(jq -r '.tools.cosign.version' "$CONFIG")}"
          cosign_sha256="${INPUT_COSIGN_SHA256:-$(jq -r '.tools.cosign.sha256' "$CONFIG")}"
          slsa_verifier_version="${INPUT_SLSA_VERIFIER_VERSION:-$(jq -r '.tools["slsa-verifier"].version' "$CONFIG")}"

          if [[ -n "${INPUT_BUILDER_IMAGE:-}" ]]; then
            builder_image="${INPUT_BUILDER_IMAGE}"
          else
            img=$(jq -r '.tools["builder-image"].image' "$CONFIG")
            tag=$(jq -r '.tools["builder-image"].tag' "$CONFIG")
            digest=$(jq -r '.tools["builder-image"].digest' "$CONFIG")
            builder_image="${img}:${tag}@${digest}"
          fi

          {
            echo "cosign_version=${cosign_version}"
            echo "cosign_sha256=${cosign_sha256}"
            echo "slsa_verifier_version=${slsa_verifier_version}"
            echo "builder_image=${builder_image}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved tool versions:"
          echo "  cosign: ${cosign_version} (sha256: ${cosign_sha256:0:16}...)"
          echo "  slsa-verifier: ${slsa_verifier_version}"
          echo "  builder-image: ${builder_image}"

  # ===============================================================
  # Run verification modes
  # ===============================================================
  verify:
    needs: load_versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            github-releases.githubusercontent.com:443
            github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            rekor.sigstore.dev:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            timestamp.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - name: Prepare tooling
        id: setup
        shell: bash
        env:
          GHA_MODES_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          modes_input="${GHA_MODES_INPUT}"
          if [[ -z "$modes_input" ]]; then
            modes_input="full"
          fi

          IFS=',' read -ra raw_modes <<< "$modes_input"
          declare -a modes=()
          need_verifier=false
          need_docker=false

          for raw_mode in "${raw_modes[@]}"; do
            mode=$(echo "$raw_mode" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            if [[ -z "$mode" ]]; then
              continue
            fi
            case "$mode" in
              quick|full|vsa)
                need_verifier=true
                ;;
              reproduce)
                need_docker=true
                ;;
              *)
                echo "Unsupported mode '$raw_mode'" >&2
                exit 1
                ;;
            esac
            modes+=("$mode")
          done

          if [[ ${#modes[@]} -eq 0 ]]; then
            modes+=(full)
            need_verifier=true
          fi

          {
            echo "modes=$(IFS=,; echo "${modes[*]}")"
            echo "need_verifier=$need_verifier"
            echo "need_docker=$need_docker"
          } >> "$GITHUB_OUTPUT"

          if [[ "$need_verifier" == "true" ]]; then
            COSIGN_VERSION="${{ needs.load_versions.outputs.cosign_version }}"
            COSIGN_SHA256="${{ needs.load_versions.outputs.cosign_sha256 }}"
            curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
              --proto '=https' --proto-redir '=https' --max-redirs 1 \
              -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
            echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
            install -m 0755 cosign /usr/local/bin/cosign

            go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@${{ needs.load_versions.outputs.slsa_verifier_version }}
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
  
          if [[ "$need_docker" == "true" ]]; then
            docker info >/dev/null
            docker pull "${{ needs.load_versions.outputs.builder_image }}" >/dev/null
          fi

      - name: Run verification modes
        env:
          COSIGN_EXPERIMENTAL: 1
          GH_TOKEN: ${{ github.token }}
          GHA_CALLER_REPO: ${{ github.repository }}
          GHA_MODES: ${{ steps.setup.outputs.modes }}
          GHA_EMIT_VSA: ${{ inputs.emit_vsa }}
          GHA_VERIFIER_ID: ${{ inputs.verifier_id }}
          GHA_POLICY_URI: ${{ inputs.policy_uri }}
          GHA_INPUT_REPO: ${{ inputs.repo }}
          GHA_INPUT_TAG: ${{ inputs.tag }}
          GHA_WORKFLOW_REPO: ${{ inputs.workflow_repo }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GHA_INPUT_REPO}" != "${GHA_CALLER_REPO}" ]]; then
            echo "::error title=Cross-Repo Not Supported::Cross-repo verification is not supported in this workflow. Run it from the target repo or use verify-release.sh directly."
            exit 1
          fi

          IFS=',' read -ra modes <<< "${GHA_MODES}"
          emit_vsa="${GHA_EMIT_VSA}"
          verifier_id="${GHA_VERIFIER_ID}"
          policy_uri="${GHA_POLICY_URI}"

          declare -a emit_args=()
          if [[ "$emit_vsa" == "true" ]]; then
            emit_args+=(--emit-vsa verification-summary.attestation.json)
            emit_args+=(--policy-file slsa-workflow/verify-release.sh)
            emit_args+=(--verifier-id "$verifier_id")
            if [[ -n "$policy_uri" ]]; then
              emit_args+=(--policy-uri "$policy_uri")
            fi
          fi

          saw_full=false
          for mode in "${modes[@]}"; do
            if [[ -z "$mode" ]]; then
              continue
            fi
            case "$mode" in
              quick|full|reproduce|vsa) : ;;
              *) echo "Unsupported mode '$mode'" >&2; exit 1 ;;
            esac

            declare -a extra_args=()
            if [[ "$mode" == "full" ]]; then
              saw_full=true
              if [[ "$emit_vsa" == "true" ]]; then
                extra_args+=("${emit_args[@]}")
              fi
            fi

            echo "Running verify-release.sh in $mode mode"
            ./slsa-workflow/verify-release.sh \
              --repo "${GHA_INPUT_REPO}" \
              --tag "${GHA_INPUT_TAG}" \
              --mode "$mode" \
              --signer-repo "${GHA_WORKFLOW_REPO}" \
              "${extra_args[@]}"
          done

          if [[ "$emit_vsa" == "true" && "$saw_full" != "true" ]]; then
            echo "emit_vsa requested but no full mode was executed" >&2
            exit 1
          fi

      - name: Sign emitted VSA
        if: ${{ inputs.emit_vsa }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "emit_vsa requires id-token: write permissions" >&2
            exit 1
          fi
          rm -f verification-summary.attestation.json.bundle
          cosign sign-blob --yes --bundle verification-summary.attestation.json.bundle verification-summary.attestation.json

      - name: Upload VSA artifact
        if: ${{ inputs.emit_vsa }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vsa-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            verification-summary.attestation.json
            verification-summary.attestation.json.bundle
