# This workflow updates SHA256 hashes in .github/tool-versions.json when
# tool versions are bumped (e.g., by Renovate). Since the config file is
# not a workflow file, only `contents: write` permission is needed—no
# special `workflows` permission required.

name: Refresh Tool Hashes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/tool-versions.json
      - scripts/update-tool-versions.sh
  workflow_dispatch:

    ###################################################################
    #                                                                 #
    #                      Manual dispatch inputs                     #
    #                                                                 #
    ###################################################################

    inputs:
      use_latest:
        description: 'Use latest versions for all tools'
        required: false
        default: 'false'
      cosign_version:
        description: 'Override cosign version (default: current)'
        required: false
      gh_version:
        description: 'Override gh version (default: current)'
        required: false
      jq_version:
        description: 'Override jq version (default: current)'
        required: false
      slsa_verifier_version:
        description: 'Override slsa-verifier version (default: current)'
        required: false

permissions: {}

jobs:

  # ===============================================================
  # Download tools and update SHA256 hashes
  # ===============================================================
  refresh:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout PR branch
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Checkout branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update tool hashes (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.cosign_version }}
          GH_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.gh_version }}
          JQ_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.jq_version }}
          SLSA_VERIFIER_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.slsa_verifier_version }}
        run: |
          set -euo pipefail
          bash scripts/update-tool-versions.sh

      - name: Update tool hashes (PR)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/update-tool-versions.sh

      - name: Commit and push updates
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet .github/tool-versions.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tool-versions.json
          git commit -m "chore: refresh tool hashes"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            target_ref="${PR_HEAD_REF}"
          else
            target_ref="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$target_ref" ]]; then
            echo "Unable to determine target ref for push." >&2
            exit 1
          fi

          git push origin "HEAD:${target_ref}"
