# This workflow updates SHA256 hashes in .github/tool-versions.json when
# tool versions are bumped (e.g., by Renovate). Since the config file is
# not a workflow file, only `contents: write` permission is needed—no
# special `workflows` permission required.

name: Refresh Tool Hashes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/tool-versions.json
      - scripts/update-tool-versions.sh
  workflow_dispatch:

    ###################################################################
    #                                                                 #
    #                      Manual dispatch inputs                     #
    #                                                                 #
    ###################################################################

    inputs:
      use_latest:
        description: 'Use latest versions for all tools'
        required: false
        default: 'false'
      cosign_version:
        description: 'Override cosign version (default: current)'
        required: false
      gh_version:
        description: 'Override gh version (default: current)'
        required: false
      jq_version:
        description: 'Override jq version (default: current)'
        required: false
      slsa_verifier_version:
        description: 'Override slsa-verifier version (default: current)'
        required: false
      tool_versions_file:
        description: 'Path to the tool versions file'
        required: false
        default: '.github/tool-versions.json'

permissions: {}

jobs:

  # ===============================================================
  # Download tools and update SHA256 hashes
  # ===============================================================
  refresh:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Get app token
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        id: app-token
        with:
          app-id: ${{ vars.PINNED_HASH_UPDATED_APP_ID }}
          private-key: ${{ secrets.PINNED_HASH_UPDATED_KEY }}

      - name: Validate PR context
        if: ${{ github.event_name == 'pull_request' }}
        id: pr-context
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
        run: |
          set -euo pipefail
          # Validate and export PR context for safe use
          {
            echo "pr_head_ref=${PR_HEAD_REF}"
            echo "pr_head_repo=${PR_HEAD_REPO}"
            echo "pr_head_sha=${PR_HEAD_SHA}"
          } >> "$GITHUB_OUTPUT_FILE"

      - name: Checkout PR branch
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-context.outputs.pr_head_ref }}
          repository: ${{ steps.pr-context.outputs.pr_head_repo }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false

      - name: Checkout branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false

      - name: Update tool hashes (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL_VERSIONS_FILE: ${{ github.event.inputs.tool_versions_file }}
          COSIGN_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.cosign_version }}
          GH_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.gh_version }}
          JQ_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.jq_version }}
          SLSA_VERIFIER_VERSION: ${{ github.event.inputs.use_latest == 'true' && 'latest' || github.event.inputs.slsa_verifier_version }}
        run: |
          set -euo pipefail
          bash scripts/update-tool-versions.sh

      - name: Update tool hashes (PR)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL_VERSIONS_FILE: ${{ github.event.inputs.tool_versions_file }}
        run: |
          set -euo pipefail
          bash scripts/update-tool-versions.sh

      - name: Commit and push updates
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          FILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tool_versions_file || '.github/tool-versions.json' }}
          PR_HEAD_REF: ${{ steps.pr-context.outputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ steps.pr-context.outputs.pr_head_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$FILE"; then
            echo "No changes to commit."
            exit 0
          fi

          api_token="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [[ -z "$api_token" ]]; then
            echo "Missing GitHub token for API calls." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            latest_commit_sha="${PR_HEAD_SHA}"
            target_ref="${PR_HEAD_REF}"
          else
            latest_commit_sha="$(git rev-parse HEAD)"
            target_ref="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$latest_commit_sha" || -z "$target_ref" ]]; then
            echo "Unable to resolve target ref or commit SHA." >&2
            exit 1
          fi

          file_content_b64=$(base64 < "${FILE}" | tr -d '\n')

          blob_sha=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${api_token}" \
            -d "$(jq -n --arg content "$file_content_b64" '{content: $content, encoding: "base64"}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            | jq -r '.sha')

          if [[ -z "$blob_sha" || "$blob_sha" == "null" ]]; then
            echo "Unable to create blob for ${FILE}." >&2
            exit 1
          fi

          base_tree_sha=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${api_token}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${latest_commit_sha}" \
            | jq -r '.tree.sha')

          if [[ -z "$base_tree_sha" || "$base_tree_sha" == "null" ]]; then
            echo "Unable to resolve base tree SHA." >&2
            exit 1
          fi

          tree_hash=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${api_token}" \
            -d "$(jq -n --arg base "$base_tree_sha" --arg path "$FILE" --arg sha "$blob_sha" \
              '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}] }')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees" \
            | jq -r '.sha')

          if [[ -z "$tree_hash" || "$tree_hash" == "null" ]]; then
            echo "Unable to create tree for ${FILE}." >&2
            exit 1
          fi

          # Create a new commit with the updated tree
          author_name="${APP_SLUG:-github-actions}[bot]"
          author_email="${author_name}@users.noreply.github.com"
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          commit_message=$'chore: refresh tool hashes\n\nSigned-off-by: '"${author_name} <${user_id}+${author_email}>"

          commit=$(curl -sSfL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${api_token}" \
            -d "$(jq -n \
              --arg message "$commit_message" \
              --arg tree "$tree_hash" \
              --arg parent "$latest_commit_sha" \
              '{message: $message, tree: $tree, parents: [$parent]}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits")

          commit_sha="$(jq -r '.sha' <<< "$commit")"

          if [[ -z "$commit_sha" || "$commit_sha" == "null" ]]; then
            echo "Commit creation failed; missing commit SHA." >&2
            exit 1
          fi

          # Update the reference of the target branch to point to the new commit
          curl -sSfL --request PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${api_token}" \
            -d "$(jq -n --arg sha "$commit_sha" '{sha: $sha}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${target_ref}"

          commit_verified="false"
          for _ in 1 2 3 4 5; do
            sleep 2
            commit_verified="$(curl -sSfL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${api_token}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${commit_sha}" \
              | jq -r '.commit.verification.verified // "false"')"
            if [[ "${commit_verified}" == "true" ]]; then
              break
            fi
          done

          if [[ "${commit_verified}" != "true" ]]; then
            RED=$'\033[0;31m'
            RESET=$'\033[0m'
            echo "${RED}Commit signature could not be verified.${RESET}" >&2
            exit 1
          fi

          GREEN=$'\033[0;32m'
          RESET=$'\033[0m'
          echo "${GREEN}Committed and pushed via GitHub API (verified signature).${RESET}"
