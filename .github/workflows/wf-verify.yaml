---

name: Verify (examples)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to verify (default: this repo)'
        required: false
        default: ${{ github.repository }}
      tag:
        description: 'Release tag to verify'
        required: true
      mode:
        description: 'Verification mode'
        required: false
        default: full
      emit_vsa:
        description: 'Emit VSA during verification (true/false)'
        required: false
        default: 'false'

permissions: {}

jobs:
  full_verification:
    if: ${{ github.event.inputs.mode == 'full' || !github.event.inputs.mode }}
    uses: ./.github/workflows/verify.yaml
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      tag: ${{ github.event.inputs.tag }}
      mode: ${{ github.event.inputs.mode || 'full' }}
      emit_vsa: ${{ github.event.inputs.emit_vsa == 'true' }}
      verifier_id: https://github.com/${{ github.repository }}/.github/workflows/wf-verify.yaml@${{ github.sha }}

  quick_verification:
    if: ${{ github.event.inputs.mode == 'quick' }}
    uses: ./.github/workflows/verify.yaml
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      tag: ${{ github.event.inputs.tag }}
      mode: quick

  vsa_only:
    if: ${{ github.event.inputs.mode == 'vsa' }}
    uses: ./.github/workflows/verify.yaml
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      tag: ${{ github.event.inputs.tag }}
      mode: vsa
