---

name: SLSA Build Level 3 Provenance and GitHub Artifact Attestations

on:
  workflow_call:
    inputs:
      create_release:
        description: >-
          Create or update the GitHub Release
        type: boolean
        required: false
        default: true
      dry_run:
        description: Run the workflow in dry-run mode
        type: boolean
        required: false
        default: false
      sign_blobs:
        description: Sign release artifacts
        type: boolean
        required: false
        default: true
      extended_metadata:
        description: >-
          Generate extended metadata (full per-file manifest + full commit
          metadata)
        type: boolean
        required: false
        default: false
      packaging_language:
        description: >-
          Packaging language (go|generic|auto)
        type: string
        required: false
        default: auto
      sbom_language:
        description: >-
          SBOM generator selection (go|generic|auto)
        type: string
        required: false
        default: auto
      cdxgen_version:
        description: >-
          cdxgen version for generic SBOM generation (npm version/tag, leading v ok)
        type: string
        required: false
        default: v12.0.0
      node_version:
        description: >-
          Node.js version for cdxgen (generic SBOM)
        type: string
        required: false
        default: 24.13.0
      builder_image:
        description: >-
          Builder image (with digest) used for packaging and rebuild verification
        type: string
        required: false
        default: golang:1.25-bookworm@sha256:51b6b12427dc03451c24f7fc996c43a20e8a8e56f0849dd0db6ff6e9225cc892
      cosign_version:
        description: >-
          Cosign version for signing/verification
        type: string
        required: false
        default: v3.0.4
      cosign_sha256:
        description: >-
          SHA-256 for the cosign Linux binary
        type: string
        required: false
        default: 10dab2fd2170b5aa0d5c0673a9a2793304960220b314f6a873bf39c2f08287aa
      gh_version:
        description: >-
          GitHub CLI version for VSA emission
        type: string
        required: false
        default: v2.85.0
      gh_sha256:
        description: >-
          SHA-256 for the GitHub CLI Linux tarball
        type: string
        required: false
        default: 5dcc4e282b9c22c0d31c217805976448c966cfc56c20157c78385a8a62c93cf0
      jq_version:
        description: >-
          jq version for verification helpers
        type: string
        required: false
        default: jq-1.8.1
      jq_sha256:
        description: >-
          SHA-256 for the jq Linux binary
        type: string
        required: false
        default: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
      slsa_verifier_version:
        description: >-
          slsa-verifier version (go install)
        type: string
        required: false
        default: v2.7.1
      workflow_repo:
        description: >-
          Reusable workflow repository (owner/repo) to fetch helper scripts. This is only useful for
          forks of the workflow so that they can point to their own repo.
        type: string
        required: false
        default: bytemare/slsa
      workflow_ref:
        description: >-
          Reusable workflow ref to check out (tag/sha/branch). Set this to the
          same ref used in the caller's uses: statement to keep scripts pinned.
        type: string
        required: true

permissions: { }

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  package_source:
    # Hermetic packaging job: runs offline in the pinned Go toolchain container.
    name: Package hermetic source
    if: ${{ inputs.dry_run || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    # Fully containerize to ensure hermetic, consistent environment.
    container:
      image: ${{ inputs.builder_image }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_filename: ${{ steps.package.outputs.artifact_filename }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
      subjects_b64: ${{ steps.package.outputs.subjects_b64 }}
      artifact_path: ${{ steps.package.outputs.artifact_path }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            artifactcache.actions.githubusercontent.com:443

      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - id: package
        name: Package reproducible source
        env:
          EXTENDED_METADATA: ${{ inputs.extended_metadata }}
          PACKAGING_LANGUAGE: ${{ inputs.packaging_language }}
          # Persist the builder digest so build.env captures it for downstream verification.
          SLSA_BUILDER_IMAGE: ${{ inputs.builder_image }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash slsa-workflow/scripts/package-source.sh

      - name: Upload packaging bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-${{ steps.package.outputs.artifact_filename }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.artifact_path }}
            subjects.sha256
            checksums.txt
            manifest.files.sha256
            commit.metadata
            build.env
            verification.json

  sbom_and_release:
    # Networked follow-up job: consumes packaging artifacts, generates SBOM/attestations.
    name: SBOM + Attest + Publish
    needs: package_source
    if: ${{ inputs.dry_run || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.builder_image }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            artifactcache.actions.githubusercontent.com:443
            ctfe.sigstore.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            storage.googleapis.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - id: sbom_lang
        name: Select SBOM generator
        env:
          SBOM_LANGUAGE: ${{ inputs.sbom_language }}
        run: |
          set -euo pipefail
          lang="${SBOM_LANGUAGE}"
          lang="$(echo "$lang" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [[ -z "$lang" ]]; then
            lang="auto"
          fi
          if [[ "$lang" == "auto" ]]; then
            if [[ -f go.mod ]]; then
              lang="go"
            else
              lang="generic"
            fi
          fi
          case "$lang" in
            go|generic) ;;
            *) echo "Unsupported sbom_language: $lang (expected go|generic|auto)" >&2; exit 1 ;;
          esac
          echo "lang=$lang" >> "$GITHUB_OUTPUT"

      - name: Download packaging bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: package-${{ needs.package_source.outputs.artifact_filename }}
          path: package

      - name: Prepare artifact paths
        id: paths
        env:
          ARTIFACT_PATH: ${{ needs.package_source.outputs.artifact_path }}
        run: |
          TAR="package/${ARTIFACT_PATH}"
          {
            echo "artifact_path=${TAR}"
            echo "subjects_path=package/subjects.sha256"
            echo "checksums_path=package/checksums.txt"
            echo "manifest_path=package/manifest.files.sha256"
            echo "metadata_path=package/verification.json"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        env:
          COSIGN_VERSION: ${{ inputs.cosign_version }}
          COSIGN_SHA256: ${{ inputs.cosign_sha256 }}
        run: |
          set -euo pipefail
          curl -sSfL --proto '=https' --proto-redir '=https' --max-redirs 1 \
            -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign

      - name: Setup Node (for cdxgen)
        if: ${{ steps.sbom_lang.outputs.lang == 'generic' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ inputs.node_version }}

      - name: Generate CycloneDX SBOM (generic)
        if: ${{ steps.sbom_lang.outputs.lang == 'generic' }}
        env:
          CDXGEN_VERSION: ${{ inputs.cdxgen_version }}
        run: |
          set -euo pipefail
          version="${CDXGEN_VERSION:-latest}"
          version="${version#v}"
          npx --yes "@cyclonedx/cdxgen@${version}" -o sbom.cdx.json .

      - name: Generate CycloneDX SBOM (Go modules)
        if: ${{ steps.sbom_lang.outputs.lang == 'go' }}
        uses: CycloneDX/gh-gomod-generate-sbom@171199f37bbd0f611db19484319e87d2ee441f97
        with:
          version: 1
          args: mod -licenses -json -output sbom.cdx.json .

      - name: Attest SBOM (bind SBOM to tarball digest)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-sbom@6cf30ca381902d015a1ba331977ad71315dffb36
        with:
          subject-checksums: ${{ steps.paths.outputs.subjects_path }}
          sbom-path: sbom.cdx.json

      - name: Attest build provenance (GitHub native)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@6865550d0380db508fc599a58cc87c50c0bba5c5
        with:
          subject-path: ${{ steps.paths.outputs.artifact_path }}

      - id: sign
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        name: Cosign sign source artifact
        env:
          COSIGN_EXPERIMENTAL: 1
          ART_PATH: ${{ steps.paths.outputs.artifact_path }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "${ART_PATH}.bundle" "${ART_PATH}"
          echo "bundle_file=${ART_PATH}.bundle" >> "$GITHUB_OUTPUT"

      - name: Cosign sign SBOM
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle sbom.cdx.json.bundle sbom.cdx.json

      - name: Cosign sign checksums manifest
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle package/checksums.txt.bundle package/checksums.txt

      - name: Create/Update GitHub Release
        if: ${{ !inputs.dry_run && inputs.create_release }}
        uses: softprops/action-gh-release@78237c54eb15310cb292a15480c4be010be47aeb
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.paths.outputs.artifact_path }}
            ${{ steps.sign.outputs.bundle_file }}
            sbom.cdx.json
            sbom.cdx.json.bundle
            package/checksums.txt
            package/checksums.txt.bundle
            package/subjects.sha256
            package/manifest.files.sha256
            package/commit.metadata
            package/build.env
            slsa-workflow/scripts/package-source.sh
            package/verification.json

      - name: Upload artifacts (PR dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dryrun-${{ needs.package_source.outputs.artifact_filename }}
          if-no-files-found: warn
          path: |
            ${{ steps.paths.outputs.artifact_path }}
            sbom.cdx.json
            package/subjects.sha256
            package/checksums.txt
            package/manifest.files.sha256
            package/commit.metadata
            package/build.env
            slsa-workflow/scripts/package-source.sh
            package/verification.json

  verify_release_vsa:
    name: Verify release (full + reproduce) & emit VSA
    if: ${{ !inputs.dry_run && inputs.create_release && inputs.sign_blobs }}
    needs: [sbom_and_release, provenance_slsa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            github-releases.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            artifactcache.actions.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ctfe.sigstore.dev:443
            oauth2.sigstore.dev:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - name: Install verification tools
        env:
          COSIGN_VERSION: ${{ inputs.cosign_version }}
          COSIGN_SHA256: ${{ inputs.cosign_sha256 }}
          GH_VERSION: ${{ inputs.gh_version }}
          GH_SHA256: ${{ inputs.gh_sha256 }}
          JQ_VERSION: ${{ inputs.jq_version }}
          JQ_SHA256: ${{ inputs.jq_sha256 }}
          SLSA_VERIFIER_VERSION: ${{ inputs.slsa_verifier_version }}
        run: |
          set -euo pipefail
          curl -sSfL --proto '=https' --proto-redir '=https' --max-redirs 1 \
            -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign
          curl -sSfL --proto '=https' --proto-redir '=https' --max-redirs 1 \
            -o gh.tgz "https://github.com/cli/cli/releases/download/${GH_VERSION}/gh_${GH_VERSION#v}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  gh.tgz" | sha256sum -c -
          tar -xzf gh.tgz
          install -m 0755 "gh_${GH_VERSION#v}_linux_amd64/bin/gh" /usr/local/bin/gh
          curl -sSfL --proto '=https' --proto-redir '=https' --max-redirs 1 \
            -o jq "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  jq" | sha256sum -c -
          install -m 0755 jq /usr/local/bin/jq
          go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@"${SLSA_VERIFIER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify release (reproduce)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          WORKFLOW_REPO="${{ steps.workflow_source.outputs.repo }}"
          ./slsa-workflow/verify-release.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --mode reproduce \
            --signer-repo "${WORKFLOW_REPO}"

      - name: Verify release & emit VSA (full)
        env:
          COSIGN_EXPERIMENTAL: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          WORKFLOW_REPO="${{ steps.workflow_source.outputs.repo }}"
          WORKFLOW_REF="${{ steps.workflow_source.outputs.ref }}"
          WORKFLOW_VERIFIER_ID="https://github.com/${WORKFLOW_REPO}/.github/workflows/slsa.yaml@${WORKFLOW_REF}"
          POLICY_URI="https://github.com/${WORKFLOW_REPO}/blob/${WORKFLOW_REF}/verify-release.sh"
          VERIFY_SCRIPT_SHA=$(sha256sum slsa-workflow/verify-release.sh | awk '{print $1}')
          ./slsa-workflow/verify-release.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --mode full \
            --emit-vsa verification-summary.attestation.json \
            --verifier-id "${WORKFLOW_VERIFIER_ID}" \
            --verifier-version "workflow_ref=${WORKFLOW_REF}" \
            --verifier-version "script_sha=${VERIFY_SCRIPT_SHA}" \
            --policy-uri "${POLICY_URI}" \
            --policy-file slsa-workflow/verify-release.sh \
            --signer-repo "${WORKFLOW_REPO}" \
            --resource-uri "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Cosign sign VSA
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle verification-summary.attestation.json.bundle verification-summary.attestation.json

      - name: Attach VSA assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            verification-summary.attestation.json \
            verification-summary.attestation.json.bundle \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify uploaded VSA
        env:
          COSIGN_EXPERIMENTAL: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if ./slsa-workflow/verify-release.sh --repo "${GITHUB_REPOSITORY}" --tag "${TAG}" --mode vsa; then
              exit 0
            fi
            echo "VSA not available yet (attempt ${attempt}); retrying in 6s..." >&2
            sleep 6
          done
          echo "VSA verification failed after retries" >&2
          exit 1

  verify_release_workflow:
    name: Verify release (reusable workflow)
    if: ${{ !inputs.dry_run && inputs.create_release && inputs.sign_blobs }}
    needs: [sbom_and_release, provenance_slsa]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify.yaml
    with:
      repo: ${{ github.repository }}
      tag: ${{ github.ref_name }}
      mode: full,reproduce
      emit_vsa: false
      workflow_repo: ${{ inputs.workflow_repo }}
      workflow_ref: ${{ inputs.workflow_ref }}
  rebuild_verify:
    # Purpose: independently re-run packaging to assert determinism (SLSA Level 4).
    name: Rebuild & Verify Determinism
    if: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    needs: package_source
    runs-on: ubuntu-latest
    container:
      # Mirror the hermetic builder so the rebuild check uses identical bits.
      image: ${{ inputs.builder_image }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443

      - name: Checkout repo (fresh workspace)
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - id: repackage
        name: Re-run deterministic packaging
        env:
          EXTENDED_METADATA: ${{ inputs.extended_metadata }}
          PACKAGING_LANGUAGE: ${{ inputs.packaging_language }}
          # The rebuild must mirror the original builder image to satisfy L4 reproducibility.
          SLSA_BUILDER_IMAGE: ${{ inputs.builder_image }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash slsa-workflow/scripts/package-source.sh

      - name: Compare digests
        # Fails fast if non-deterministic differences emerge.
        env:
          ORIG_SHA256: ${{ needs.package_source.outputs.artifact_sha256 }}
          NEW_SHA256: ${{ steps.repackage.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          orig="${ORIG_SHA256}"
          new="${NEW_SHA256}"
          echo "Original digest: $orig"
          echo "Rebuilt  digest: $new"
          if [ "$orig" != "$new" ]; then
            echo 'Digest mismatch! Rebuild not deterministic.' >&2
            exit 1
          fi
          echo 'Rebuild determinism verified.'

  provenance_slsa:
    name: SLSA Build Level 3 Provenance
    if: ${{ !inputs.dry_run && github.ref_type == 'tag' }}
    needs: [package_source, rebuild_verify]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.package_source.outputs.subjects_b64 }}
      upload-assets: true
    permissions:
      actions: read
      id-token: write
      contents: write
