---

name: SLSA Build Track Level 3 Provenance and GitHub Artifact Attestations

on:
  workflow_call:

    ###################################################################
    #                                                                 #
    #                         Workflow inputs                         #
    #                                                                 #
    ###################################################################

    inputs:
      create_release:
        description: >-
          Create or update the GitHub Release
        type: boolean
        required: false
        default: true
      dry_run:
        description: Run the workflow in dry-run mode
        type: boolean
        required: false
        default: false
      sign_blobs:
        description: Sign release artifacts
        type: boolean
        required: false
        default: true
      extended_metadata:
        description: >-
          Generate extended metadata (full per-file manifest + full commit
          metadata)
        type: boolean
        required: false
        default: false
      packaging_language:
        description: >-
          Packaging language (go|generic|auto)
        type: string
        required: false
        default: auto
      sbom_language:
        description: >-
          SBOM generator selection (go|generic|auto)
        type: string
        required: false
        default: auto
      cdxgen_version:
        description: >-
          cdxgen version override (default: from tool-versions.json)
        type: string
        required: false
      node_version:
        description: >-
          Node.js version override (default: from tool-versions.json)
        type: string
        required: false
      builder_image:
        description: >-
          Builder image override (default: from tool-versions.json)
        type: string
        required: false
      cosign_version:
        description: >-
          Cosign version override (default: from tool-versions.json)
        type: string
        required: false
      cosign_sha256:
        description: >-
          SHA-256 override for cosign (default: from tool-versions.json)
        type: string
        required: false
      gh_version:
        description: >-
          GitHub CLI version override (default: from tool-versions.json)
        type: string
        required: false
      gh_sha256:
        description: >-
          SHA-256 override for GitHub CLI (default: from tool-versions.json)
        type: string
        required: false
      jq_version:
        description: >-
          jq version override (default: from tool-versions.json)
        type: string
        required: false
      jq_sha256:
        description: >-
          SHA-256 override for jq (default: from tool-versions.json)
        type: string
        required: false
      slsa_verifier_version:
        description: >-
          slsa-verifier version override (default: from tool-versions.json)
        type: string
        required: false
      workflow_repo:
        description: >-
          Reusable workflow repository (owner/repo) to fetch helper scripts. This is only useful for
          forks of the workflow so that they can point to their own repo.
        type: string
        required: false
        default: bytemare/slsa
      workflow_ref:
        description: >-
          Reusable workflow ref to check out (tag/sha/branch). Set this to the
          same ref used in the caller's uses: statement to keep scripts pinned.
        type: string
        required: true

###################################################################
#                                                                 #
#                  Permissions and concurrency                    #
#                                                                 #
###################################################################

permissions: { }

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ===============================================================
  # Load tool versions from central config
  # ===============================================================
  load_versions:
    name: Load tool versions
    runs-on: ubuntu-latest
    # Timeout: Quick config parsing task (expected: <1 min)
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cosign_version: ${{ steps.resolve.outputs.cosign_version }}
      cosign_sha256: ${{ steps.resolve.outputs.cosign_sha256 }}
      gh_version: ${{ steps.resolve.outputs.gh_version }}
      gh_sha256: ${{ steps.resolve.outputs.gh_sha256 }}
      jq_version: ${{ steps.resolve.outputs.jq_version }}
      jq_sha256: ${{ steps.resolve.outputs.jq_sha256 }}
      slsa_verifier_version: ${{ steps.resolve.outputs.slsa_verifier_version }}
      cdxgen_version: ${{ steps.resolve.outputs.cdxgen_version }}
      node_version: ${{ steps.resolve.outputs.node_version }}
      builder_image: ${{ steps.resolve.outputs.builder_image }}
    steps:
      - name: Validate required inputs
        id: validate
        shell: bash
        env:
          INPUT_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          INPUT_WORKFLOW_REPO: ${{ inputs.workflow_repo }}
        run: |
          if [[ -z "$INPUT_WORKFLOW_REF" ]]; then
            echo "::error title=Missing Required Input::workflow_ref is required. Set it to the same ref used in uses: ...@<ref>"
            exit 1
          fi
          
          # Export validated values for use in checkout
          workflow_repo="${INPUT_WORKFLOW_REPO:-bytemare/slsa}"
          {
            echo "workflow_repo=${workflow_repo}"
            echo "workflow_ref=${INPUT_WORKFLOW_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.validate.outputs.workflow_repo }}
          ref: ${{ steps.validate.outputs.workflow_ref }}
          sparse-checkout: .github/tool-versions.json
          fetch-depth: 1

      - name: Load and resolve versions
        id: resolve
        env:
          INPUT_COSIGN_VERSION: ${{ inputs.cosign_version }}
          INPUT_COSIGN_SHA256: ${{ inputs.cosign_sha256 }}
          INPUT_GH_VERSION: ${{ inputs.gh_version }}
          INPUT_GH_SHA256: ${{ inputs.gh_sha256 }}
          INPUT_JQ_VERSION: ${{ inputs.jq_version }}
          INPUT_JQ_SHA256: ${{ inputs.jq_sha256 }}
          INPUT_SLSA_VERIFIER_VERSION: ${{ inputs.slsa_verifier_version }}
          INPUT_CDXGEN_VERSION: ${{ inputs.cdxgen_version }}
          INPUT_NODE_VERSION: ${{ inputs.node_version }}
          INPUT_BUILDER_IMAGE: ${{ inputs.builder_image }}
        run: |
          set -euo pipefail
          CONFIG=".github/tool-versions.json"

          # Load from config, allow input overrides
          cosign_version="${INPUT_COSIGN_VERSION:-$(jq -r '.tools.cosign.version' "$CONFIG")}"
          cosign_sha256="${INPUT_COSIGN_SHA256:-$(jq -r '.tools.cosign.sha256' "$CONFIG")}"
          gh_version="${INPUT_GH_VERSION:-$(jq -r '.tools.gh.version' "$CONFIG")}"
          gh_sha256="${INPUT_GH_SHA256:-$(jq -r '.tools.gh.sha256' "$CONFIG")}"
          jq_version="${INPUT_JQ_VERSION:-$(jq -r '.tools.jq.version' "$CONFIG")}"
          jq_sha256="${INPUT_JQ_SHA256:-$(jq -r '.tools.jq.sha256' "$CONFIG")}"
          slsa_verifier_version="${INPUT_SLSA_VERIFIER_VERSION:-$(jq -r '.tools["slsa-verifier"].version' "$CONFIG")}"
          cdxgen_version="${INPUT_CDXGEN_VERSION:-$(jq -r '.tools.cdxgen.version' "$CONFIG")}"
          node_version="${INPUT_NODE_VERSION:-$(jq -r '.tools.node.version' "$CONFIG")}"

          # Build builder_image from components if not overridden
          if [[ -n "${INPUT_BUILDER_IMAGE:-}" ]]; then
            builder_image="${INPUT_BUILDER_IMAGE}"
          else
            img=$(jq -r '.tools["builder-image"].image' "$CONFIG")
            tag=$(jq -r '.tools["builder-image"].tag' "$CONFIG")
            digest=$(jq -r '.tools["builder-image"].digest' "$CONFIG")
            builder_image="${img}:${tag}@${digest}"
          fi

          # Output all resolved versions
          {
            echo "cosign_version=${cosign_version}"
            echo "cosign_sha256=${cosign_sha256}"
            echo "gh_version=${gh_version}"
            echo "gh_sha256=${gh_sha256}"
            echo "jq_version=${jq_version}"
            echo "jq_sha256=${jq_sha256}"
            echo "slsa_verifier_version=${slsa_verifier_version}"
            echo "cdxgen_version=${cdxgen_version}"
            echo "node_version=${node_version}"
            echo "builder_image=${builder_image}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved tool versions:"
          echo "  cosign: ${cosign_version} (sha256: ${cosign_sha256:0:16}...)"
          echo "  gh: ${gh_version} (sha256: ${gh_sha256:0:16}...)"
          echo "  jq: ${jq_version} (sha256: ${jq_sha256:0:16}...)"
          echo "  slsa-verifier: ${slsa_verifier_version}"
          echo "  cdxgen: ${cdxgen_version}"
          echo "  node: ${node_version}"
          echo "  builder-image: ${builder_image}"

  # ===============================================================
  # Hermetic source packaging (offline, containerized)
  # ===============================================================
  package_source:
    name: Package hermetic source
    needs: load_versions
    if: ${{ inputs.dry_run || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    # Timeout: Packaging script with reproducible builds (expected: 5-10 min)
    timeout-minutes: 15
    container:
      image: ${{ needs.load_versions.outputs.builder_image }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_filename: ${{ steps.package.outputs.artifact_filename }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
      subjects_b64: ${{ steps.package.outputs.subjects_b64 }}
      artifact_path: ${{ steps.package.outputs.artifact_path }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            artifactcache.actions.githubusercontent.com:443

      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          {
            echo "repo=${repo}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - id: package
        name: Package reproducible source
        env:
          EXTENDED_METADATA: ${{ inputs.extended_metadata }}
          PACKAGING_LANGUAGE: ${{ inputs.packaging_language }}
          # Persist the builder digest so build.env captures it for downstream verification.
          SLSA_BUILDER_IMAGE: ${{ needs.load_versions.outputs.builder_image }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash slsa-workflow/scripts/package-source.sh

      - name: Upload packaging bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-${{ steps.package.outputs.artifact_filename }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.artifact_path }}
            subjects.sha256
            checksums.txt
            manifest.files.sha256
            commit.metadata
            build.env
            verification.json

  # ===============================================================
  # SBOM generation, attestations, and release publishing
  # ===============================================================
  sbom_and_release:
    name: SBOM + Attest + Publish
    needs: [load_versions, package_source]
    if: ${{ inputs.dry_run || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    # Timeout considerations mainly depend on SBOM generation with cdxgen and npm registry latency.
    # 20 minutes sounds like plenty of time, but increase to 30 if large repos regularly timeout.
    timeout-minutes: 20
    container:
      image: ${{ needs.load_versions.outputs.builder_image }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          # Security Note: SBOM generation with cdxgen fetches from npm registry,
          # allowing arbitrary package downloads. Compromised dependencies could
          # exfiltrate data. This is inherent to SBOM generation.
          # Mitigation: cdxgen version is pinned and audited before updates.
          # Consider: Run SBOM job with minimal secrets access.
          allowed-endpoints: >
            api.github.com:443
            artifactcache.actions.githubusercontent.com:443
            ctfe.sigstore.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            storage.googleapis.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          {
            echo "repo=${repo}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - id: sbom_lang
        name: Select SBOM generator
        env:
          SBOM_LANGUAGE: ${{ inputs.sbom_language }}
        run: |
          set -euo pipefail
          lang="${SBOM_LANGUAGE}"
          lang="$(echo "$lang" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [[ -z "$lang" ]]; then
            lang="auto"
          fi
          if [[ "$lang" == "auto" ]]; then
            if [[ -f go.mod ]]; then
              lang="go"
            else
              lang="generic"
            fi
          fi
          case "$lang" in
            go|generic) ;;
            *) echo "Unsupported sbom_language: $lang (expected go|generic|auto)" >&2; exit 1 ;;
          esac
          echo "lang=$lang" >> "$GITHUB_OUTPUT"

      - name: Download packaging bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: package-${{ needs.package_source.outputs.artifact_filename }}
          path: package

      - name: Prepare artifact paths
        id: paths
        env:
          ARTIFACT_PATH: ${{ needs.package_source.outputs.artifact_path }}
        run: |
          TAR="package/${ARTIFACT_PATH}"
          {
            echo "artifact_path=${TAR}"
            echo "subjects_path=package/subjects.sha256"
            echo "checksums_path=package/checksums.txt"
            echo "manifest_path=package/manifest.files.sha256"
            echo "metadata_path=package/verification.json"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        uses: ./.github/actions/install-cosign
        with:
          version: ${{ needs.load_versions.outputs.cosign_version }}
          sha256: ${{ needs.load_versions.outputs.cosign_sha256 }}

      - name: Setup Node (for cdxgen)
        if: ${{ steps.sbom_lang.outputs.lang == 'generic' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ needs.load_versions.outputs.node_version }}

      - name: Generate CycloneDX SBOM (generic)
        if: ${{ steps.sbom_lang.outputs.lang == 'generic' }}
        env:
          CDXGEN_VERSION: ${{ needs.load_versions.outputs.cdxgen_version }}
        run: |
          set -euo pipefail
          version="${CDXGEN_VERSION:-latest}"
          version="${version#v}"
          npx --yes "@cyclonedx/cdxgen@${version}" -o sbom.cdx.json .

      - name: Generate CycloneDX SBOM (Go modules)
        if: ${{ steps.sbom_lang.outputs.lang == 'go' }}
        uses: CycloneDX/gh-gomod-generate-sbom@171199f37bbd0f611db19484319e87d2ee441f97
        with:
          version: 1
          args: mod -licenses -json -output sbom.cdx.json .

      - name: Attest SBOM (bind SBOM to tarball digest)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-sbom@6cf30ca381902d015a1ba331977ad71315dffb36
        with:
          subject-checksums: ${{ steps.paths.outputs.subjects_path }}
          sbom-path: sbom.cdx.json

      - name: Attest build provenance (GitHub native)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@6865550d0380db508fc599a58cc87c50c0bba5c5
        with:
          subject-path: ${{ steps.paths.outputs.artifact_path }}

      - id: sign
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        name: Cosign sign source artifact
        env:
          COSIGN_EXPERIMENTAL: 1
          ART_PATH: ${{ steps.paths.outputs.artifact_path }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "${ART_PATH}.bundle" "${ART_PATH}"
          echo "bundle_file=${ART_PATH}.bundle" >> "$GITHUB_OUTPUT"

      - name: Cosign sign SBOM
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle sbom.cdx.json.bundle sbom.cdx.json

      - name: Cosign sign checksums manifest
        if: ${{ !inputs.dry_run && inputs.sign_blobs }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle package/checksums.txt.bundle package/checksums.txt

      - name: Create/Update GitHub Release
        if: ${{ !inputs.dry_run && inputs.create_release }}
        uses: softprops/action-gh-release@78237c54eb15310cb292a15480c4be010be47aeb
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.paths.outputs.artifact_path }}
            ${{ steps.sign.outputs.bundle_file }}
            sbom.cdx.json
            sbom.cdx.json.bundle
            package/checksums.txt
            package/checksums.txt.bundle
            package/subjects.sha256
            package/manifest.files.sha256
            package/commit.metadata
            package/build.env
            slsa-workflow/scripts/package-source.sh
            package/verification.json

      - name: Upload artifacts (PR dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dryrun-${{ needs.package_source.outputs.artifact_filename }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ steps.paths.outputs.artifact_path }}
            sbom.cdx.json
            package/subjects.sha256
            package/checksums.txt
            package/manifest.files.sha256
            package/commit.metadata
            package/build.env
            slsa-workflow/scripts/package-source.sh
            package/verification.json

  # ===============================================================
  # Post-release verification and VSA emission
  # ===============================================================
  verify_release_workflow:
    name: Verify release (reusable workflow)
    if: ${{ !inputs.dry_run && inputs.create_release && inputs.sign_blobs }}
    needs: [sbom_and_release, provenance_slsa]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/verify.yaml
    with:
      repo: ${{ github.repository }}
      tag: ${{ github.ref_name }}
      mode: full,reproduce
      emit_vsa: true
      upload_to_release: true
      verify_vsa_after_upload: true
      resource_uri: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      policy_uri: https://github.com/${{ inputs.workflow_repo }}/blob/${{ inputs.workflow_ref }}/verify-release.sh
      workflow_repo: ${{ inputs.workflow_repo }}
      workflow_ref: ${{ inputs.workflow_ref }}

  # ===============================================================
  # Reproducibility check (SLSA Level 4 preparation)
  # ===============================================================
  rebuild_verify:
    name: Rebuild & Verify Determinism
    if: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    needs: [load_versions, package_source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Mirror the hermetic builder so the rebuild check uses identical bits.
      image: ${{ needs.load_versions.outputs.builder_image }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443

      - name: Checkout repo (fresh workspace)
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Resolve workflow source
        id: workflow_source
        env:
          WORKFLOW_REPO_INPUT: ${{ inputs.workflow_repo }}
          WORKFLOW_REF_INPUT: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          repo="${WORKFLOW_REPO_INPUT:-bytemare/slsa}"
          ref="${WORKFLOW_REF_INPUT}"
          if [[ -z "$ref" ]]; then
            echo "Missing required input: workflow_ref (set to the same ref as uses: ...@<ref>)" >&2
            exit 1
          fi
          {
            echo "repo=${repo}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout workflow repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: ${{ steps.workflow_source.outputs.repo }}
          ref: ${{ steps.workflow_source.outputs.ref }}
          path: slsa-workflow
          fetch-depth: 1

      - id: repackage
        name: Re-run deterministic packaging
        env:
          EXTENDED_METADATA: ${{ inputs.extended_metadata }}
          PACKAGING_LANGUAGE: ${{ inputs.packaging_language }}
          # The rebuild must mirror the original builder image to satisfy L4 reproducibility.
          SLSA_BUILDER_IMAGE: ${{ needs.load_versions.outputs.builder_image }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash slsa-workflow/scripts/package-source.sh

      - name: Compare digests
        # Fails fast if non-deterministic differences emerge.
        env:
          ORIG_SHA256: ${{ needs.package_source.outputs.artifact_sha256 }}
          NEW_SHA256: ${{ steps.repackage.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          orig="${ORIG_SHA256}"
          new="${NEW_SHA256}"
          echo "Original digest: $orig"
          echo "Rebuilt  digest: $new"
          if [ "$orig" != "$new" ]; then
            echo 'Digest mismatch! Rebuild not deterministic.' >&2
            exit 1
          fi
          echo 'Rebuild determinism verified.'

  # ===============================================================
  # SLSA Level 3 provenance generation
  # ===============================================================
  provenance_slsa:
    name: SLSA Build Level 3 Provenance
    if: ${{ !inputs.dry_run && github.ref_type == 'tag' }}
    needs: [package_source, rebuild_verify]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
