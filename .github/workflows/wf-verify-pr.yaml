---

name: Test Verify SLSA Compliance

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  get-latest-release:
    name: Get latest release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.latest_release.outputs.tag }}
    steps:
      - name: Get latest release tag
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${latest_tag}"

  Verification:
    name: Run verification
    needs: get-latest-release
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/verify.yaml
    with:
      repo: ${{ github.repository }}
      tag: ${{ needs.get-latest-release.outputs.tag }}
      mode: full,reproduce
      emit_vsa: true
      workflow_ref: ${{ github.event.pull_request.head.sha }}